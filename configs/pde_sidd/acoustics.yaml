defaults: common.yaml
dataset: acoustics
directory: acoustics_fixed_ic_1000
shape: [256, 256]
frames: 61
dynamic_fields:
  - {name: pressure, path: t0_fields/pressure, semantic: pressure, group: pressure, unit: unknown}
  - {name: velocity_x, path: t1_fields/velocity, component: 0, semantic: velocity_x, group: velocity, unit: unknown}
  - {name: velocity_y, path: t1_fields/velocity, component: 1, semantic: velocity_y, group: velocity, unit: unknown}
static_fields:
  - {name: material_density, path: t0_fields/material_density, group: material_density, unit: unknown}
  - {name: bulk_modulus, path: t0_fields/bulk_modulus, group: bulk_modulus, unit: unknown}
  - {name: sound_speed, path: t0_fields/sound_speed, group: sound_speed, unit: unknown}
parameters:
  - {name: density_left, path: scalars/density_left, unit: unknown}
  - {name: bulk_modulus_left, path: scalars/bulk_modulus_left, unit: unknown}
  - {name: density_right, path: scalars/density_right, unit: unknown}
  - {name: bulk_modulus_right, path: scalars/bulk_modulus_right, unit: unknown}
