name: Config-driven LATTE pipeline
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-pipeline.txt
          python -m pip check
      - name: Run data-free pipeline and release tests
        run: python -m unittest scripts.test_latte_pipeline scripts.test_latte_ablation_sweep scripts.test_package_latte_pipeline -v
      - name: Test the isolated release allowlist
        run: |
          python scripts/package_latte_pipeline.py --destination "$RUNNER_TEMP/latte-bundle"
          cd "$RUNNER_TEMP/latte-bundle"
          python -m unittest scripts.test_latte_pipeline scripts.test_latte_ablation_sweep scripts.test_package_latte_pipeline -v
